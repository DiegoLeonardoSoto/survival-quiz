<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Survival Quiz</title>
        <link rel="stylesheet" href="./src/output.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Stack+Sans+Notch:wght@200..700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />
    </head>
    <body class="bg-background bg-grid min-h-screen overflow-hidden">
        <main
            class="font-agdasima relative w-full md:w-screen mx-auto min-h-screen flex flex-col items-center justify-center"
        >
            <div
                class="absolute top-0 right-0 w-full h-full bg-[linear-gradient(to_right,#999da9_1px,transparent_.5px),linear-gradient(to_bottom,#999da9_1px,transparent_.5px)] bg-size-[70px_70px] mask-linear-0 mask-linear-from-30% mask-linear-to-60% -z-50"
            ></div>

            <div
                id="wrongGradient"
                class="opacity-0 absolute top-0 right-0 w-full h-full bg-linear-to-t from-wrong from-0% via-transparent via-70% -z-10 transition duration-300"
            ></div>

            <div
                id="correctGradient"
                class="opacity-0 absolute top-0 right-0 w-full h-full bg-linear-to-t from-accent from-0% via-transparent via-70% -z-20 transition duration-300"
            ></div>

            <h1
                id="title"
                class="font-stack-sans-notch text-accent text-4xl md:text-5xl font-bold"
                style="view-transition-name: title"
            >
                Survival Quiz
            </h1>

            <!-- GAME SCREEN -->
            <section
                id="screen-game"
                class="flex flex-col w-full h-full justify-center items-center"
            >
                <span
                    id="timer"
                    class="text-6xl md:text-8xl mt-4 mb-6 font-bold text-center"
                    >00:00:00</span
                >

                <p
                    id="question"
                    class="bg-secondary text-xl md:text-2xl text-white flex text-center w-full justify-center py-6 md:py-8 px-6 md:px-12"
                ></p>

                <div
                    id="answers"
                    class="grid grid-cols-1 md:grid-cols-2 w-full px-4 md:w-2xl md:px-0 gap-4 mt-8"
                >
                    <button
                        disabled
                        id="btn-answer-1"
                        class="bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted"
                    ></button>
                    <button
                        disabled
                        id="btn-answer-2"
                        class="bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted"
                    ></button>
                    <button
                        disabled
                        id="btn-answer-3"
                        class="bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted"
                    ></button>
                    <button
                        disabled
                        id="btn-answer-4"
                        class="bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted"
                    ></button>
                </div>
            </section>

            <button
                id="btn-play"
                class="bg-primary w-14 md:w-16 flex items-center justify-center rounded-md p-3 md:p-4 mt-2 cursor-pointer absolute bottom-4 right-4 md:bottom-24 md:right-6 hidden"
            >
                <svg class="w-6 h-6 text-white fill-current">
                    <use href="../assets/sprites.svg#icon-play"></use>
                </svg>
            </button>

            <button
                disabled
                id="btn-refresh"
                class="absolute bottom-10 right-4 w-14 md:w-16 md:bottom-6 md:right-6 bg-muted flex items-center justify-center rounded-md p-3 mt-2 transition-all duration-200"
            >
                <svg class="w-10 h-10 text-white fill-current">
                    <use href="../assets/sprites.svg#icon-refresh"></use>
                </svg>

                <span
                    class="absolute inset-0 flex items-center justify-center text-white text-2xl font-bold text-solid-shadow hidden"
                    >1</span
                >
            </button>

            <div
                id="streak"
                class="origin-center bg-secondary text-white text-2xl md:text-5xl font-bold rounded-xl absolute bottom-5 left-4 md:left-10 px-3 md:px-6 md:py-4 py-2 hidden will-change-transform backface-hidden"
            >
                x0
            </div>
        </main>

        <script src="../js/game.js" type="module"></script>
    </body>
</html>
