<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Survival Quiz</title>
        <link rel="stylesheet" href="./src/output.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Stack+Sans+Notch:wght@200..700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />
        <script src="./js/game.js" type="module"></script>
    </head>
    <body class="bg-background bg-grid min-h-dvh overflow-hidden">
        <main
            class="font-agdasima relative w-full md:w-screen mx-auto min-h-dvh flex flex-col items-center justify-center overflow-hidden opacity-0 transition-all duration-200"
        >
            <div
                id="gridBackground"
                class="absolute top-0 right-0 w-full h-full bg-[linear-gradient(to_right,#999da9_1px,transparent_.5px),linear-gradient(to_bottom,#999da9_1px,transparent_.5px)] bg-size-[70px_70px] mask-linear-0 mask-linear-from-30% mask-linear-to-60% -z-50"
            ></div>

            <div
                id="wrongGradient"
                class="opacity-0 absolute top-0 right-0 w-full h-full bg-linear-to-t from-wrong from-0% via-transparent via-70% -z-10 transition duration-300"
            ></div>

            <div
                id="correctGradient"
                class="opacity-0 absolute top-0 right-0 w-full h-full bg-linear-to-t from-accent from-0% via-transparent via-70% -z-20 transition duration-300"
            ></div>

            <h1
                id="title"
                class="font-stack-sans-notch text-accent text-4xl md:text-5xl font-bold"
                style="view-transition-name: title"
            >
                Survival Quiz
            </h1>

            <!-- GAME SCREEN -->
            <section
                id="screen-game"
                class="flex flex-col w-full h-full justify-center items-center"
            >
                <span
                    id="timer"
                    class="text-6xl md:text-8xl mt-4 mb-6 font-bold text-center"
                    >00:00:00</span
                >

                <div
                    id="wrapper-question"
                    class="bg-wrong text-xl md:text-2xl text-white flex text-center justify-center w-full relative"
                >
                    <div
                        id="bar-progress-question"
                        class="origin-left bg-secondary w-full absolute top-0 left-0 z-30 h-full"
                    ></div>
                    <p id="question" aria-live="polite" class="py-6 md:py-8 px-6 md:px-12 z-40">
                        Respondé. Sobreviví. No falles. Estas listo?...
                    </p>
                </div>

                <div
                    id="answers"
                    class="grid grid-cols-1 place-items-center md:grid-cols-2 w-full px-4 md:w-2xl md:px-0 gap-4 mt-8"
                >
                    <button
                        id="btn-play"
                        class="text-6xl md:text-9xl font-black text-center col-span-2 p-24 cursor-pointer"
                        aria-label="Comenzar partida"
                    >
                        Jugar
                    </button>
                    <button
                        disabled
                        id="btn-answer-1"
                        class="btn-answer bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted hidden"
                        aria-label="Opción 1"
                        aria-disabled="true"
                    ></button>
                    <button
                        disabled
                        id="btn-answer-2"
                        class="btn-answer bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted hidden"
                        aria-label="Opción 2"
                        aria-disabled="true"
                    ></button>
                    <button
                        disabled
                        id="btn-answer-3"
                        class="btn-answer bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted hidden"
                        aria-label="Opción 3"
                        aria-disabled="true"
                    ></button>
                    <button
                        disabled
                        id="btn-answer-4"
                        class="btn-answer bg-background text-xl md:text-2xl md:h-24 md:rounded-3xl font-bold text-secondary border-4 border-secondary p-2 md:p-3 rounded-full w-full cursor-pointer disabled:border-muted disabled:text-muted hidden"
                        aria-label="Opción 4"
                        aria-disabled="true"
                    ></button>
                </div>
            </section>

            <button
                disabled
                id="btn-refresh"
                class="fixed bottom-4 right-4 w-14 h-14 md:w-20 md:h-20 md:bottom-6 md:right-6 bg-transparent flex items-center justify-center rounded-md p-3 mt-2 hidden"
                aria-label="Refrescar pregunta"
                aria-disabled="true"
            >
                <svg class="w-14 h-14 text-white fill-current">
                    <use href="./assets/sprites.svg#icon-refresh"></use>
                </svg>

                <span
                    class="absolute inset-0 flex items-center justify-center text-white text-2xl font-bold text-solid-shadow transition-all duration-300 hidden"
                    >1</span
                >
            </button>

            <div
                id="streak"
                class="origin-center bg-secondary text-white text-2xl md:text-5xl font-bold rounded-xl fixed bottom-5 left-4 md:left-10 px-3 md:px-6 md:py-4 py-2 hidden will-change-transform backface-hidden"
                aria-live="polite"
                aria-atomic="true"
            >
                x0
            </div>
        </main>
    </body>
</html>
