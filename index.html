<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Survival Quiz</title>
        <link rel="stylesheet" href="./src/output.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Stack+Sans+Notch:wght@200..700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />
    </head>
    <body class="bg-background bg-grid min-h-screen overflow-hidden">
        <main
            class="font-agdasima relative w-full md:w-screen mx-auto min-h-screen flex flex-col items-center justify-center overflow-hidden"
        >
            <div
                id="gridBackground"
                class="absolute top-0 right-0 w-full h-full bg-[linear-gradient(to_right,#999da9_1px,transparent_.5px),linear-gradient(to_bottom,#999da9_1px,transparent_.5px)] bg-size-[70px_70px] mask-linear-0 mask-linear-from-30% mask-linear-to-60% -z-50"
            ></div>
            <!-- START SCREEN -->
            <h1
                id="title"
                class="font-stack-sans-notch text-accent text-4xl md:text-6xl font-bold"
                style="view-transition-name: title"
            >
                Survival Quiz
            </h1>

            <section
                id="screen-start"
                class="flex flex-col items-center gap-6 text-center"
            >
                <p class="text-xl md:text-2xl">
                    Respondé. Sobreviví. No falles.
                </p>

                <div class="flex flex-col gap-3">
                    <!-- Fácil -->
                    <input
                        type="radio"
                        id="easy"
                        name="difficulty"
                        value="easy"
                        class="peer/easy hidden"
                        checked
                    />
                    <label
                        for="easy"
                        class="flex-1 bg-muted text-white rounded-full p-3 font-bold cursor-pointer text-center transition-all duration-200 peer-checked/easy:bg-accent peer-checked/easy:text-secondary"
                    >
                        Fácil
                    </label>

                    <!-- Medio -->
                    <input
                        type="radio"
                        id="medium"
                        name="difficulty"
                        value="medium"
                        class="peer/medium hidden"
                    />
                    <label
                        for="medium"
                        class="flex-1 bg-muted text-white rounded-full p-3 font-bold cursor-pointer text-center transition-all duration-200 peer-checked/medium:bg-yellow peer-checked/medium:text-secondary"
                    >
                        Medio
                    </label>

                    <!-- Difícil -->
                    <input
                        type="radio"
                        id="hard"
                        name="difficulty"
                        value="hard"
                        class="peer/hard hidden"
                    />
                    <label
                        for="hard"
                        class="flex-1 bg-muted text-white rounded-full p-3 font-bold cursor-pointer text-center transition-all duration-200 peer-checked/hard:bg-wrong peer-checked/hard:text-secondary"
                    >
                        Difícil
                    </label>

                    <button
                        id="btn-start"
                        class="bg-secondary px-6 mt-4 md:px-10 py-3 text-white text-xl md:text-2xl rounded-lg cursor-pointer flex items-center gap-3 hover:bg-primary transitiontransition-all duration-200"
                    >
                        COMENZAR

                        <svg class="w-6 h-6 text-white fill-current">
                            <use href="assets/sprites.svg#icon-play"></use>
                        </svg>
                    </button>
                </div>
            </section>
        </main>
        <script>
            const startButton = document.querySelector("#btn-start");

            let difficulty;

            startButton.addEventListener("click", () => {
                difficulty = document.querySelector(
                    "input[name='difficulty']:checked",
                ).value;
                window.location.href = `./game.html?difficulty=${difficulty}`;
            });
        </script>
    </body>
</html>
