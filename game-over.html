<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Survival Quiz</title>
        <link rel="stylesheet" href="./src/output.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Stack+Sans+Notch:wght@200..700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />
    </head>
    <body class="bg-background bg-grid min-h-screen overflow-hidden">
        <main
            class="font-ibm-plex-sans relative w-full max-w-lg mx-auto min-h-screen flex flex-col items-center justify-center px-4"
        >
            <div
                class="absolute top-0 right-0 w-full h-full bg-[linear-gradient(to_right,#010a29_1px,transparent_1px),linear-gradient(to_bottom,#010a29_1px,transparent_1px)] bg-size-[70px_70px] mask-linear-0 mask-linear-from-10% mask-linear-to-25% -z-10"
            ></div>
            <!-- START SCREEN -->
            <h1
                id="title"
                class="font-stack-sans-notch text-accent text-5xl font-bold"
                style="view-transition-name: title"
            >
                Survival Quiz
            </h1>

            <section
                id="screen-start"
                class="flex flex-col items-center text-center w-80 mt-8"
            >
                <svg class="w-16 h-16 text-secondary fill-current my-5">
                    <use href="assets/sprites.svg#icon-document"></use>
                </svg>
                <p
                    class="px-8 text-secondary text-3xl rounded-lg cursor-pointer flex items-center gap-3"
                >
                    Sobreviviste por
                </p>
                <p class="text-5xl font-extrabold mt-3">00:10:10</p>

                <table class="table-auto w-full text-lg my-5">
                    <tbody>
                        <tr class="flex gap-3">
                            <td class="flex-2 text-right">
                                Cantidad de preguntas:
                            </td>
                            <td class="flex-1 text-left">15</td>
                        </tr>
                        <tr class="flex gap-3 my-3">
                            <td class="flex-2 text-right">
                                Respuestas correctas:
                            </td>
                            <td class="flex-1 text-left">10</td>
                        </tr>
                        <tr class="flex gap-3">
                            <td class="flex-2 text-right">Racha mas larga:</td>
                            <td class="flex-1 text-left">5</td>
                        </tr>
                    </tbody>
                </table>

                <button
                    class="bg-primary px-8 py-3 text-white text-2xl rounded-lg cursor-pointer flex items-center gap-3 mt-5"
                >
                    REINTENTAR
                    <svg class="w-6 h-6 text-white fill-current">
                        <use href="../assets/sprites.svg#icon-play"></use>
                    </svg>
                </button>
            </section>
        </main>
    </body>
</html>
